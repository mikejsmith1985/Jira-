<!doctype html>
<!-- data-theme is stamped here, and again from main.tsx before React mounts, so
     the page never paints one theme and then flips to the other. Dark is the
     default: the operating system is not asked. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jira+</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
